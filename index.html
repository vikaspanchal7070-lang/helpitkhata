<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Cleaning Booking</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12302b;--mute:#5b736e;--line:#d3dedb;--accent:#0f766e;--accent-ink:#fff;--stub:#12302b;--stub-ink:#f2f7f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a18;--card:#152623;--ink:#e6f0ed;--mute:#93aba5;--line:#28403b;--accent:#2dd4bf;--accent-ink:#0d1a18;--stub:#0a1412;--stub-ink:#e6f0ed}}
:root[data-theme="dark"]{--bg:#0d1a18;--card:#152623;--ink:#e6f0ed;--mute:#93aba5;--line:#28403b;--accent:#2dd4bf;--accent-ink:#0d1a18;--stub:#0a1412;--stub-ink:#e6f0ed}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans","Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font:600 30px/1.15 "Fraunces",Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.top{padding:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.top h2{margin:0;font:600 26px/1.2 "Fraunces",Georgia,serif}
.status{padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px 24px;padding:0 24px 24px}
.grid dt{font-size:13px;color:var(--mute);margin:0}
.grid dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.pay{margin:0 24px 24px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pay-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--accent);color:var(--accent)}
.pay-g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pay-g dt{font-size:13px;color:var(--mute)}.pay-g dd{margin:2px 0 0;font:600 20px "Fraunces",Georgia,serif}
.bar{height:10px;background:var(--line);border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
@media (max-width:420px){.pay-g dd{font-size:16px}}
.ph{font-size:15px;margin:18px 0 6px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plist .amt{font-weight:600;color:var(--accent)}.plist .meta{color:var(--mute);font-size:14px}
.plist button{padding:4px 10px;font-size:13px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.padd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;align-items:end}
.padd button{grid-column:1/-1}.padd label:nth-child(3){grid-column:1/-1}
.notes{padding:0 24px 24px}
.notes p{margin:4px 0 0;white-space:pre-wrap}
.stub{background:var(--stub);color:var(--stub-ink);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px dashed var(--line)}
.ref{font:600 22px "Courier New",monospace;letter-spacing:.08em}
.days{font-size:15px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
form{display:none;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
form.open{display:block}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:block;font-size:14px;color:var(--mute)}
input,select,textarea{width:100%;margin-top:4px;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{min-height:80px;resize:vertical}
.wide{grid-column:1/-1}
@media print{.actions,form{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<main>
  <h1>My cleaning booking</h1>
  <p class="sub">Your house cleaning details in one place. No sign-in needed.</p>
  <p class="sub" id="sync" role="status" style="font-size:14px"></p>

  <section class="ticket" aria-live="polite">
    <div class="top">
      <div><h2 id="v-title"></h2><div id="v-loc" class="sub" style="margin:4px 0 0"></div></div>
      <span class="status" id="v-status"></span>
    </div>
    <dl class="grid">
      <div><dt>Customer name</dt><dd id="v-name"></dd></div>
      <div><dt>Start date</dt><dd id="v-in"></dd></div>
      <div><dt>End date</dt><dd id="v-out"></dd></div>
      <div><dt>Cleaners</dt><dd id="v-guests"></dd></div>
      <div><dt>Service</dt><dd id="v-room"></dd></div>
      <div><dt>Phone</dt><dd id="v-phone"></dd></div>
      <div><dt>Email</dt><dd id="v-email"></dd></div>
    </dl>
    <div class="pay">
      <div class="pay-h"><strong>Payment</strong><span id="p-tag" class="tag"></span></div>
      <div class="pay-g">
        <div><dt>Total payment</dt><dd id="p-total"></dd></div>
        <div><dt>Received</dt><dd id="p-paid" style="color:var(--accent)"></dd></div>
        <div><dt>Remaining</dt><dd id="p-due"></dd></div>
      </div>
      <div class="bar" role="progressbar" aria-label="Payment received"><i id="p-bar"></i></div>
      <h3 class="ph">Payments received</h3>
      <ul id="p-list" class="plist"></ul>
      <div class="padd">
        <label>Date<input type="date" id="a-date"></label>
        <label>Amount (₹)<input type="number" min="1" id="a-amt"></label>
        <label>Note<input id="a-note" placeholder="Cash, UPI, advance"></label>
        <button class="primary" id="a-btn" type="button">Add payment</button>
      </div>
    </div>
    <div class="notes"><dt style="font-size:13px;color:var(--mute)">Notes</dt><p id="v-notes"></p></div>
    <div class="stub"><div><div style="font-size:13px;opacity:.7">Booking number</div><div class="ref" id="v-ref"></div></div><div class="days" id="v-days"></div></div>
  </section>

  <div class="actions">
    <button class="primary" id="edit">Edit details</button>
    <button id="copy">Copy summary</button>
    <button id="print">Print</button>
  </div>

  <form id="form">
    <div class="fields">
      <label class="wide">Booking title<input name="title" required></label>
      <label class="wide">Home address<input name="loc"></label>
      <label>Customer name<input name="name"></label>
      <label>Status<select name="status"><option>Confirmed</option><option>Pending</option><option>Cancelled</option></select></label>
      <label>Start date<input type="date" name="in"></label>
      <label>End date<input type="date" name="out"></label>
      <label>Cleaners<input type="number" min="1" name="guests"></label>
      <label>Service<input name="room"></label>
      <label>Total payment (₹)<input type="number" min="0" name="price"></label>
      <label>Booking number<input name="ref"></label>
      <label>Phone<input name="phone"></label>
      <label>Email<input type="email" name="email"></label>
      <label class="wide">Notes<textarea name="notes"></textarea></label>
    </div>
    <div class="actions"><button class="primary" type="submit">Save changes</button><button type="button" id="cancel">Cancel</button></div>
  </form>
</main>
<script>
var KEY="my-cleaning-v4";
var data={title:"House Cleaning",loc:"Your home address",name:"Your Name",status:"Confirmed",in:"2026-10-01",out:"2026-10-05",guests:2,room:"Full house cleaning, daily visit",price:"6000",payments:[{d:"2026-09-28",a:2000,n:"Advance"}],ref:"CL-1001",phone:"+91 98765 43210",email:"you@example.com",notes:"Arrival 9 AM each day.\nFocus: kitchen, bathrooms, floors."};
try{var s=localStorage.getItem(KEY);if(s)data=Object.assign(data,JSON.parse(s))}catch(e){}
function total(){return(data.payments||[]).reduce(function(a,x){return a+(Number(x.a)||0)},0)}
var $=function(i){return document.getElementById(i)};
var fmt=function(v){if(!v)return"Not set";var d=new Date(v+"T00:00");return isNaN(d)?v:d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})};
function render(){
  $("v-title").textContent=data.title||"Untitled booking";
  $("v-loc").textContent=data.loc||"";
  $("v-status").textContent=data.status;
  $("v-name").textContent=data.name||"Not set";
  $("v-in").textContent=fmt(data.in);$("v-out").textContent=fmt(data.out);
  $("v-guests").textContent=data.guests||"Not set";
  $("v-room").textContent=data.room||"Not set";
  var tot=Number(data.price)||0,rec=total(),due=Math.max(tot-rec,0);
  var m=function(n){return"₹"+n.toLocaleString("en-IN")};
  $("p-total").textContent=m(tot);$("p-paid").textContent=m(rec);$("p-due").textContent=m(due);
  $("p-bar").style.width=(tot?Math.min(rec/tot*100,100):0)+"%";
  var ul=$("p-list");ul.innerHTML="";
  var ps=(data.payments||[]).slice().sort(function(a,b){return a.d<b.d?-1:1});
  if(!ps.length){var e=document.createElement("li");e.className="empty";e.textContent="No payment received yet.";ul.appendChild(e)}
  ps.forEach(function(x){var li=document.createElement("li"),l=document.createElement("div"),a=document.createElement("div"),b=document.createElement("button");
    l.innerHTML='<div></div><div class="meta"></div>';l.firstChild.textContent=fmt(x.d);l.lastChild.textContent=x.n||"";
    a.className="amt";a.textContent=m(Number(x.a)||0);
    b.textContent="Remove";b.type="button";b.setAttribute("aria-label","Remove payment of "+x.a);
    b.onclick=function(){data.payments=data.payments.filter(function(y){return y!==x});save();render()};
    var r=document.createElement("div");r.style.cssText="display:flex;gap:10px;align-items:center";r.appendChild(a);r.appendChild(b);
    li.appendChild(l);li.appendChild(r);ul.appendChild(li)});
  $("p-tag").textContent=tot&&due===0?"Fully paid":rec>0?"Partly paid":"Unpaid";
  $("v-phone").textContent=data.phone||"Not set";
  $("v-email").textContent=data.email||"Not set";
  $("v-notes").textContent=data.notes||"No notes";
  $("v-ref").textContent=data.ref||"-";
  var t=new Date();t.setHours(0,0,0,0);
  var a=data.in?Math.round((new Date(data.in+"T00:00")-t)/864e5):null,txt="";
  if(a!==null&&!isNaN(a)){var e=data.out?Math.round((new Date(data.out+"T00:00")-t)/864e5):a;txt=a>1?a+" days to go":a===1?"Starts tomorrow":a<=0&&e>=0?"In progress":a<0?"Completed":"Starts today"}
  var n=(data.in&&data.out)?Math.round((new Date(data.out)-new Date(data.in))/864e5)+1:0;
  $("v-days").textContent=[txt,n>0?n+" day"+(n>1?"s":""):""].filter(Boolean).join(" · ");
}
var SB_URL="https://phzfwcgckmmadqcitomf.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoemZ3Y2dja21tYWRxY2l0b21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNTc0NzIsImV4cCI6MjA5MzYzMzQ3Mn0.WWWN6rm-FWh-Vfg07hIiDmU5VWXssduR21vdfxoabDY";
var ON=SB_URL.indexOf("http")===0;
function setSync(t){$("sync").textContent=t}
var H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
function getPin(){var p="";try{p=sessionStorage.getItem("pin")||""}catch(e){}
  if(!p){p=prompt("Enter the edit PIN to save changes")||"";try{sessionStorage.setItem("pin",p)}catch(e){}}return p}
function load(){if(!ON){setSync("Cloud not connected. Changes stay on this device.");return}
  fetch(SB_URL+"/rest/v1/cleaning_booking?id=eq.1&select=data,updated_at",{headers:H}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
    if(rows[0]&&rows[0].data&&Object.keys(rows[0].data).length){data=Object.assign(data,rows[0].data)}
    setSync("Live. Last updated "+(rows[0]?new Date(rows[0].updated_at).toLocaleString():"never"));render()}).catch(function(){setSync("Could not reach the server. Check internet.")})}
function push(){if(!ON)return;var pin=getPin();if(!pin){setSync("Not saved: PIN needed.");load();return}
  fetch(SB_URL+"/rest/v1/rpc/save_cleaning_booking",{method:"POST",headers:H,body:JSON.stringify({pin:pin,payload:data})}).then(function(r){
    if(!r.ok)throw 0;setSync("Saved. Everyone with the link sees this.")}).catch(function(){
    try{sessionStorage.removeItem("pin")}catch(e){}setSync("Not saved. Wrong PIN or no internet.");load()})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(x){}push()}
render();
$("a-date").value=new Date().toISOString().slice(0,10);
$("a-btn").onclick=function(){var a=Number($("a-amt").value),d=$("a-date").value;
  if(!a||a<=0||!d){$("a-amt").focus();return}
  (data.payments=data.payments||[]).push({d:d,a:a,n:$("a-note").value.trim()});
  $("a-amt").value="";$("a-note").value="";save();render()};
var f=$("form");load();setInterval(load,30000);
$("edit").onclick=function(){Object.keys(data).forEach(function(k){if(f.elements[k])f.elements[k].value=data[k]});f.classList.add("open");f.scrollIntoView({behavior:"smooth"})};
$("cancel").onclick=function(){f.classList.remove("open")};
f.onsubmit=function(e){e.preventDefault();Object.keys(data).forEach(function(k){if(f.elements[k])data[k]=f.elements[k].value});
  save();
  render();f.classList.remove("open");window.scrollTo({top:0,behavior:"smooth"})};
$("print").onclick=function(){window.print()};
$("copy").onclick=function(){
  var t=[data.title,data.loc,"Customer: "+data.name,"Start: "+fmt(data.in),"End: "+fmt(data.out),"Booking no: "+data.ref,"Total: ₹"+(data.price||0),"Received: ₹"+total(),"Remaining: ₹"+Math.max((Number(data.price)||0)-total(),0)].concat((data.payments||[]).map(function(x){return"  "+fmt(x.d)+": ₹"+x.a+(x.n?" ("+x.n+")":"")})).join("\n");
  var b=$("copy");
  function done(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy summary"},1500)}
  try{navigator.clipboard.writeText(t).then(done,done)}catch(x){done()}
};
</script>
</body>
</html>
